server:
  port: 8080

spring:
  application:
    name: customer-management
  
  datasource:
    url: jdbc:h2:mem:customerdb;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    org.springframework.web: INFO
    org.hibernate: ERROR

customer:
  management:
    service:
      custom-property: value
